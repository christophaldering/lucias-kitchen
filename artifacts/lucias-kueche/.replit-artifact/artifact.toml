kind = "web"
previewPath = "/"
title = "Lucias Küche"
version = "1.0.0"
id = "artifacts/lucias-kueche"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18160

[services.development]
run = "pnpm --filter @workspace/lucias-kueche run dev"

[services.env]
PORT = "18160"
BASE_PATH = "/"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
