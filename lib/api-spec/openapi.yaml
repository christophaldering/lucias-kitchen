openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Lucias Küche
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: menu
    description: Menu operations
  - name: reservations
    description: Reservation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /menu:
    get:
      operationId: getMenuItems
      tags: [menu]
      summary: Get all menu items
      description: Returns all menu items grouped by category
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"

  /reservations:
    post:
      operationId: createReservation
      tags: [reservations]
      summary: Create a reservation
      description: Submit a new table reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservation"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
          enum: [vorspeisen, hauptgerichte, desserts, getraenke]
        isVegetarian:
          type: boolean
        isVegan:
          type: boolean
        isGlutenFree:
          type: boolean
        imageUrl:
          type: string
          nullable: true
      required:
        - id
        - name
        - description
        - price
        - category
        - isVegetarian
        - isVegan
        - isGlutenFree

    CreateReservation:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        guests:
          type: integer
          minimum: 1
          maximum: 20
        notes:
          type: string
          nullable: true
      required:
        - name
        - email
        - phone
        - date
        - time
        - guests

    Reservation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        date:
          type: string
        time:
          type: string
        guests:
          type: integer
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - phone
        - date
        - time
        - guests
        - status
        - createdAt

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    Season:
      type: string
      enum: [spring, summer, autumn, winter]
      description: A season identifier (spring, summer, autumn, winter)

    Recipe:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        servings:
          type: integer
          nullable: true
        prepTime:
          type: string
          nullable: true
        totalTime:
          type: string
          nullable: true
        difficulty:
          type: string
          enum: [simpel, normal, schwer]
        category:
          type: string
        rating:
          type: string
          nullable: true
        kcalPerPortion:
          type: integer
          nullable: true
        source:
          type: string
          nullable: true
        lastCooked:
          type: string
          nullable: true
        cookedCount:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        steps:
          type: array
          items:
            type: string
        imageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/Season"
          description: The seasons this recipe is suited for. Empty array means year-round.
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/RecipeIngredient"
      required:
        - id
        - title
        - difficulty
        - category
        - steps
        - ingredients
        - seasons

    RecipeIngredient:
      type: object
      properties:
        id:
          type: integer
        recipeId:
          type: integer
        amount:
          type: string
        unit:
          type: string
        name:
          type: string
        note:
          type: string
          nullable: true
      required:
        - id
        - recipeId
        - amount
        - unit
        - name
